<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>股票行情测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }
    .test-info {
      padding: 20px;
      background: white;
      margin-bottom: 20px;
    }
    .test-info h1 {
      font-size: 18px;
      margin-bottom: 10px;
    }
    .test-info p {
      color: #666;
      font-size: 14px;
    }
    .stock-item {
      display: flex;
      justify-content: space-between;
      padding: 15px;
      background: white;
      border-bottom: 1px solid #eee;
    }
    .stock-name {
      font-weight: bold;
      font-size: 16px;
    }
    .stock-code {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }
    .stock-price {
      text-align: right;
    }
    .price {
      font-weight: bold;
      font-size: 16px;
    }
    .change {
      font-size: 12px;
      margin-top: 4px;
    }
    .up { color: #ff4d4f; }
    .down { color: #52c41a; }
    .neutral { color: #333; }
    .tab-container {
      display: flex;
      background: white;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      border-bottom-color: #1890ff;
      color: #1890ff;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="test-info">
    <h1>股票行情系统测试</h1>
    <p>当前显示的是模拟数据，股票代码和涨跌幅已优化</p>
  </div>
  
  <div class="tab-container" id="tabs">
    <div class="tab active" data-market="sh">沪市</div>
    <div class="tab" data-market="sz">深市</div>
    <div class="tab" data-market="hk">港股</div>
    <div class="tab" data-market="us">美股</div>
  </div>
  
  <div id="stock-list"></div>

  <script>
    // 真实股票名称库
    const STOCK_NAMES = {
      sh: [
        '贵州茅台', '中国平安', '招商银行', '浦发银行', '上汽集团',
        '工商银行', '农业银行', '中国银行', '建设银行', '交通银行',
        '兴业银行', '民生银行', '华夏银行', '中信银行', '光大银行',
        '中国石油', '中国石化', '长江电力', '中国神华', '中国联通',
      ],
      sz: [
        '宁德时代', '比亚迪', '五粮液', '格力电器', '美的集团',
        '万科A', '平安银行', '京东方A', '立讯精密', '牧原股份',
        '海康威视', '迈瑞医疗', '爱尔眼科', '长春高新', '东方财富',
        '智飞生物', '药明康德', '汇川技术', '阳光电源', '三花智控',
      ],
      hk: [
        '腾讯控股', '阿里巴巴', '美团点评', '小米集团', '中国移动',
        '建设银行', '工商银行', '中国平安', '招商银行', '中国银行',
        '友邦保险', '香港交易所', '长江实业', '新鸿基地产', '恒基地产',
        '中石油', '中石化', '中国移动', '中国电信', '联通',
      ],
      us: [
        '苹果', '微软', '亚马逊', '谷歌', '特斯拉',
        'Meta', '英伟达', '台积电', '伯克希尔', '强生',
        'Visa', '摩根大通', '宝洁', '联合健康', '诺和诺德',
        '礼来', '阿斯麦', '博通', '腾讯', '阿里巴巴',
      ],
    };

    // 美股真实代码
    const US_STOCK_CODES = [
      'AAPL', 'MSFT', 'GOOGL', 'AMZN', 'TSLA', 'META', 'NVDA', 'JPM',
      'V', 'PG', 'JNJ', 'WMT', 'XOM', 'CVX', 'KO', 'PEP', 'COST',
      'AVGO', 'CSCO', 'ADBE', 'CRM', 'NFLX', 'INTC', 'AMD', 'ORCL',
    ];

    let currentMarket = 'sh';

    // 生成模拟数据
    function generateStocks(market) {
      const stocks = [];
      const names = STOCK_NAMES[market] || STOCK_NAMES.sh;
      
      for (let i = 0; i < 20; i++) {
        let code;
        
        if (market === 'us') {
          // 美股使用真实代码
          const codeIndex = i % US_STOCK_CODES.length;
          code = US_STOCK_CODES[codeIndex];
        } else if (market === 'hk') {
          // 港股：HK0001, HK0002...
          code = `HK${String(i + 1).padStart(4, '0')}`;
        } else {
          // 沪市/深市
          const prefix = market === 'sh' ? '600' : '000';
          code = `${prefix}${String(i).padStart(6 - prefix.length, '0')}`;
        }

        // 生成合理的涨跌幅
        const rand = Math.random();
        let changePercent;
        if (rand < 0.05) {
          // 5%的概率涨跌幅超过5%
          changePercent = (Math.random() > 0.5 ? 5.01 : -5.01) * (0.5 + Math.random() * 1.5);
        } else if (rand < 0.2) {
          // 15%的概率涨跌幅在3%-5%之间
          changePercent = (Math.random() * 2 - 1) * (3 + Math.random() * 2);
        } else {
          // 80%的概率涨跌幅在-3%到+3%之间
          changePercent = (Math.random() * 6 - 3);
        }

        // 根据市场调整价格范围
        let price;
        if (market === 'us') {
          price = 100 + Math.random() * 200;
        } else if (market === 'hk') {
          price = 50 + Math.random() * 450;
        } else {
          price = 5 + Math.random() * 95;
        }

        const name = names[i % names.length];
        const changeClass = changePercent > 0 ? 'up' : (changePercent < 0 ? 'down' : 'neutral');
        const sign = changePercent > 0 ? '+' : '';
        
        stocks.push({
          name: name,
          code: code,
          price: price.toFixed(2),
          change: changePercent.toFixed(2),
          changeClass: changeClass,
          sign: sign
        });
      }
      return stocks;
    }

    // 渲染股票列表
    function renderStocks() {
      const stocks = generateStocks(currentMarket);
      const container = document.getElementById('stock-list');
      
      container.innerHTML = stocks.map(stock => `
        <div class="stock-item">
          <div>
            <div class="stock-name">${stock.name}</div>
            <div class="stock-code">${stock.code}</div>
          </div>
          <div class="stock-price">
            <div class="price ${stock.changeClass}">${stock.price}</div>
            <div class="change ${stock.changeClass}">${stock.sign}${stock.change}%</div>
          </div>
        </div>
      `).join('');
    }

    // 切换市场
    document.getElementById('tabs').addEventListener('click', (e) => {
      if (e.target.classList.contains('tab')) {
        document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
        e.target.classList.add('active');
        currentMarket = e.target.dataset.market;
        renderStocks();
      }
    });

    renderStocks();
  </script>
</body>
</html>
